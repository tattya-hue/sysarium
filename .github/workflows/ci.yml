name: Rust checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        rust: [stable, "1.88.0"]
    env:
      RUSTUP_TOOLCHAIN: ${{ matrix.rust }}
      CARGO_TARGET_DIR: ${{ github.workspace }}/target
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install toolchain
        run: rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal --component rustfmt,clippy
      - name: Toolchain versions
        run: |
          rustc --version
          cargo --version
      - name: Format
        if: matrix.rust == 'stable'
        run: cargo fmt --all -- --check
      - name: Tests
        run: cargo test --workspace --locked
      - name: Clippy
        if: matrix.rust == 'stable'
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Release build and source installation
        run: |
          cargo build --release --locked -p sysarium
          cargo install --path apps/sysarium --locked --root "$RUNNER_TEMP/sysarium-install"
          "$RUNNER_TEMP/sysarium-install/bin/sysarium" --version
      - name: Terminal restoration and signals
        run: python3 apps/sysarium/tests/verify_terminal.py
